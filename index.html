<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e11">
<title>Urbex France</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--a:#ffb224;--ln:#2a2f38}
html,body{height:100%;margin:0;background:#0c0e11;color:#e6e8ec;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#map{position:fixed;inset:0;z-index:0;background:#0c0e11}
.t-a{color:var(--a)}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 10px #000a}
.pin span{transform:rotate(45deg);font-size:16px;line-height:1}
.pin.pend{border-style:dashed;opacity:.7}
.pill{border:1px solid var(--ln);border-radius:999px;padding:.2rem .65rem}
.btn{flex:1;text-align:center;border:1px solid var(--ln);background:#1a1e25;border-radius:.75rem;padding:.55rem .75rem;font-size:.85rem}
.btn:active,.btn.sel{background:var(--a);border-color:var(--a);color:#111}
.inp{width:100%;background:#0c0e11;border:1px solid var(--ln);border-radius:.6rem;padding:.55rem .7rem;font-size:16px}
.chip{border:1px solid var(--ln);border-radius:999px;padding:.3rem .65rem;font-size:.8rem;opacity:.45}
.chip.on{opacity:1;border-color:var(--a);background:#1a1e25}
.panel{background:rgba(18,21,26,.94);backdrop-filter:blur(8px);border:1px solid var(--ln)}

@keyframes scintil {
  0% { opacity: 1; text-shadow: 0 0 6px #b000ff; filter: brightness(1); }
  50% { opacity: 0.6; text-shadow: 0 0 16px #ff00ff; filter: brightness(1.4); }
  100% { opacity: 1; text-shadow: 0 0 6px #b000ff; filter: brightness(1); }
}
.scintillating { animation: scintil 1.2s infinite ease-in-out; }

@keyframes redScintil {
  0% { opacity: 1; text-shadow: 0 0 6px #ff0000; filter: brightness(1); }
  50% { opacity: 0.6; text-shadow: 0 0 16px #ff4d4d; filter: brightness(1.4); }
  100% { opacity: 1; text-shadow: 0 0 6px #ff0000; filter: brightness(1); }
}
.red-scintillating { animation: redScintil 1.2s infinite ease-in-out; }

.gps-pill{display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem .75rem;border-radius:999px;border:1px solid var(--ln);background:#1a1e25;font-size:.8rem;font-weight:600;color:#e6e8ec;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:all .15s ease}
.gps-pill:active{transform:scale(0.96);background:var(--a);border-color:var(--a);color:#111}
</style>
</head>
<body>
<div id="map"></div>

<header class="fixed top-0 inset-x-0 z-[1000] p-1.5 flex gap-1 items-center" style="padding-top:max(.4rem,env(safe-area-inset-top))">
  <div class="panel flex-1 flex items-center gap-1 rounded-2xl p-1 shadow-xl min-w-0">
    <form id="sf" class="flex-1 flex min-w-0"><input id="q" class="inp !border-0 !bg-transparent w-full !py-1 !text-sm" placeholder="Ville ou région…" enterkeyhint="search"><button class="btn !flex-none px-2 !py-1">🔎</button></form>
    <button id="fb" class="btn !flex-none px-2 !py-1 text-xs">Filtres</button>
  </div>
  <button id="pb" class="btn hidden !flex-none px-2 text-xs">⚠ <span id="pn"></span></button>
  <button id="admin-notif-btn" class="btn hidden !flex-none !w-9 !h-9 !p-0 flex items-center justify-center text-sm" aria-label="Notifications Admin">🔔</button>
  <button id="lb-btn" class="btn !flex-none !w-9 !h-9 !p-0 flex items-center justify-center text-sm" aria-label="Classement">🏆</button>
  <button id="user-btn" class="btn relative !flex-none !w-9 !h-9 !p-0 flex items-center justify-center text-sm" aria-label="Compte utilisateur">👤<span id="notif-dot" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-[#0c0e11]"></span></button>
  <button id="ab" class="btn !flex-none !w-9 !h-9 !p-0 flex items-center justify-center text-sm" aria-label="Administration">🔒</button>
</header>

<div id="fp" class="panel hidden fixed z-[1000] left-2 right-2 md:right-auto md:w-96 rounded-2xl p-3 space-y-2 shadow-2xl overflow-y-auto" style="top:calc(4rem + env(safe-area-inset-top));max-height:65vh">
  <p class="text-xs text-zinc-400">Catégorie</p><div id="fc" class="flex flex-wrap gap-1.5"></div>
  <p class="text-xs text-zinc-400">Niveau de danger</p><div id="fd" class="flex flex-wrap gap-1.5"></div>
  <p class="text-xs text-zinc-400">Accessibilité</p><div id="fa" class="flex flex-wrap gap-1.5"></div>
  <div class="flex items-center gap-2"><span id="cnt" class="text-xs text-zinc-500 flex-1"></span><button id="fr" class="btn !flex-none">Tout afficher</button></div>
</div>

<div id="hint" class="panel hidden fixed z-[1000] inset-x-3 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-[460px] rounded-2xl p-3 flex items-center gap-2 text-sm shadow-2xl" style="bottom:calc(6.5rem + env(safe-area-inset-bottom));border-color:var(--a)">
  <span class="flex-1">📍 Touchez la carte pour placer le repère</span>
  <button id="hf" class="btn !flex-none">Formulaire</button><button id="hx" class="btn !flex-none" aria-label="Annuler">✕</button>
</div>

<button id="fab" aria-label="Ajouter un lieu" class="fixed z-[1050] right-5 w-16 h-16 rounded-full text-4xl leading-none text-[#111] active:scale-95 transition" style="bottom:calc(1.25rem + env(safe-area-inset-bottom));background:var(--a);box-shadow:0 8px 28px rgba(255,178,36,.45)">+</button>

<aside id="sheet" class="panel hidden fixed z-[1100] inset-x-0 bottom-0 md:inset-y-0 md:left-auto md:right-0 md:w-[420px] rounded-t-2xl md:rounded-none overflow-y-auto shadow-2xl" style="max-height:82vh"></aside>

<!-- Modal d'ajout / modification de spot -->
<div id="modal" class="hidden fixed inset-0 z-[1200] bg-black/70 items-end md:items-center justify-center flex">
  <form id="f" class="panel w-full md:w-[540px] overflow-y-auto rounded-t-2xl md:rounded-2xl p-4 space-y-3" style="max-height:94vh">
    <div class="flex justify-between items-center"><h2 id="mt" class="text-lg font-bold">Ajouter un lieu</h2><button type="button" id="mx" class="text-2xl px-2" aria-label="Fermer">×</button></div>
    <input name="title" required minlength="3" maxlength="120" class="inp" placeholder="Titre (ex : Usine abandonnée X)">
    <div class="grid grid-cols-2 gap-2">
      <label class="text-xs text-zinc-400">Catégorie<select name="category" class="inp mt-1"></select></label>
      <label class="text-xs text-zinc-400">Accessibilité<select name="access" class="inp mt-1"></select></label>
      <label class="text-xs text-zinc-400 col-span-2">Niveau de danger<select name="danger" class="inp mt-1"></select></label>
    </div>
    <textarea name="description" rows="4" maxlength="4000" class="inp" placeholder="Description, historique, conseils d’accès…"></textarea>
    <div class="rounded-xl border border-zinc-800 p-3 space-y-2">
      <p class="text-xs text-zinc-400">Localisation : <b id="coord" class="t-a">non définie</b></p>
      <div class="flex gap-2"><input id="addr" class="inp" placeholder="Adresse ou ville"><button type="button" id="ag" class="btn !flex-none">🔎</button></div>
      <div class="flex gap-2"><button type="button" id="geo" class="btn">📍 Ma position</button><button type="button" id="onmap" class="btn">🗺️ Sur la carte</button></div>
    </div>
    <label class="text-xs text-zinc-400 block">Photos (5 Mo max chacune)<input id="files" type="file" accept="image/*" multiple class="inp mt-1 text-sm"></label>
    <textarea name="urls" rows="2" class="inp" placeholder="Ou liens d’images (un par ligne)"></textarea>
    <button type="submit" class="btn w-full !font-semibold" style="background:var(--a);border-color:var(--a);color:#111">Publier</button>
  </form>
</div>

<!-- Modal Notifications Admin -->
<div id="admin-notif-modal" class="hidden fixed inset-0 z-[1250] bg-black/70 items-center justify-center flex p-3">
  <div class="panel w-full md:w-[460px] rounded-2xl p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-bold">🔔 Boîte Admin : Nouveaux Lieux</h2>
      <button id="admin-notif-close" class="text-2xl px-2">×</button>
    </div>
    <div id="admin-notif-content" class="space-y-2"></div>
  </div>
</div>

<!-- Modal Classement -->
<div id="lb-modal" class="hidden fixed inset-0 z-[1250] bg-black/70 items-center justify-center flex p-3">
  <div class="panel w-full md:w-[440px] rounded-2xl p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-bold">🏆 Classement des Explorateurs</h2>
      <button id="lb-close" class="text-2xl px-2">×</button>
    </div>
    <div id="lb-content" class="space-y-2"></div>
  </div>
</div>

<!-- Modal Profil & Authentification -->
<div id="auth-modal" class="hidden fixed inset-0 z-[1250] bg-black/70 items-center justify-center flex p-3">
  <div class="panel w-full md:w-[440px] rounded-2xl p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-center">
      <h2 id="auth-title" class="text-lg font-bold">Profil Explorateur</h2>
      <button id="auth-close" class="text-2xl px-2">×</button>
    </div>
    <div id="auth-content"></div>
  </div>
</div>

<div id="toast" class="hidden fixed z-[1300] left-1/2 -translate-x-1/2 bg-zinc-900 border border-zinc-700 rounded-full px-4 py-2 text-sm shadow-xl" style="top:calc(4.5rem + env(safe-area-inset-top))"></div>

<script>
/* ===== CONFIG SUPABASE ===== */
const SB_URL = 'https://bprsxfrscxmwqqohyzbb.supabase.co';
const SB_KEY = 'sb_publishable_hh65k09ofnvS1_rkBaSRxw_I9d01qD8';

const CAT={usine:['🏭','Usine / industriel'],maison:['🏚️','Maison / manoir'],hopital:['🏥','Hôpital / asile'],eglise:['⛪','Église / couvent'],chateau:['🏰','Château'],militaire:['🪖','Militaire / bunker'],ecole:['🏫','École'],autre:['📍','Autre']};
const ACC={facile:['🟢','Facile'],moyen:['🟠','Moyen'],difficile:['🔴','Difficile / escalade']};
const DNG={faible:['#3fb950','Faible'],effondrement:['#f0883e','Risque d’effondrement'],gardien:['#d4a72c','Gardien / alarme'],amiante:['#a371f7','Amiante / gaz'],dangereux:['#f85149','Dangereux']};

const sb=supabase.createClient(SB_URL, SB_KEY),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const safe=u=>/^https?:\/\//i.test(u);
const ic=v=>v[0][0]==='#'?`<i style="background:${v[0]};width:.6rem;height:.6rem;border-radius:9px;display:inline-block;margin-right:.35rem"></i>`:v[0]+' ';
const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v[0][0]==='#'?'':v[0]+' '}${v[1]}</option>`).join('');
let spots=[],admin=false,cur=null,placing=false,formOn=false,draft={},pi=0, currentUser=null, userFavorites=new Set(), currentProfile=null, userNotifications=[];
let adminRankOn=localStorage.getItem('admin_rank_on')==='true';

const flt={c:new Set(Object.keys(CAT)),d:new Set(Object.keys(DNG)),a:new Set(Object.keys(ACC))};
const voter=localStorage.uid||(localStorage.uid=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),3200)}

/* ===== Titre Admin (sauvegardé en local) ===== */
const ADMIN_RANK={name:'🛡️ Administrateur',color:'#ff0000',pct:100,label:'Titre administrateur actif',scintillateRed:true};
const rankOf=(uid,n)=>(admin && uid && uid===currentUser?.id && adminRankOn)?ADMIN_RANK:getRankProgress(n);

function toggleAdminTitle(){
  adminRankOn = !adminRankOn;
  localStorage.setItem('admin_rank_on', adminRankOn);
  renderAuthBox();
  toast(adminRankOn ? 'Titre Admin activé' : 'Titre Admin désactivé');
}

/* ===== Carte Vue Satellite Hybride ===== */
const map=L.map('map',{zoomControl:false}).setView([46.6,2.4],6);
L.control.zoom({position:'bottomleft'}).addTo(map);

L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
  attribution: '&copy; Google Maps'
}).addTo(map);

const cl=L.markerClusterGroup({maxClusterRadius:45}).addTo(map);

function render(){
  cl.clearLayers();let n=0;
  spots.forEach(s=>{
    if(!(flt.c.has(s.category)&&flt.d.has(s.danger)&&flt.a.has(s.access)))return;n++;
    const col=(DNG[s.danger]||DNG.faible)[0],e=(CAT[s.category]||CAT.autre)[0];
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,40],html:`<div class="pin ${s.status==='active'?'':'pend'}" style="background:${col}"><span>${e}</span></div>`})}).on('click',()=>openSpot(s.id)).addTo(cl);
  });
  $('#cnt').textContent=n+' / '+spots.length+' lieux affichés';
  const p=spots.filter(s=>s.status!=='active').length;
  $('#pb').classList.toggle('hidden',!(admin&&p));$('#pn').textContent=p;
}
async function load(){
  const {data,error}=await sb.from('spots').select('*').order('created_at',{ascending:false});
  if(error)return toast('Base inaccessible : '+error.message);
  spots=data||[];render();
  await loadUserData();
}

async function loadUserData(){
  try {
    const {data:{session}}=await sb.auth.getSession();
    currentUser=session?.user||null;
    if(currentUser){
      const {data:p}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
      currentProfile=p;
      const {data:f}=await sb.from('favorites').select('spot_id').eq('user_id',currentUser.id);
      userFavorites=new Set((f||[]).map(x=>x.spot_id));

      const mySpotIds=spots.filter(s=>s.user_id===currentUser.id).map(s=>s.id);
      if(mySpotIds.length > 0){
        const {data:coms}=await sb.from('comments').select('*').in('spot_id', mySpotIds).neq('user_id', currentUser.id).order('created_at',{ascending:false});
        userNotifications=coms||[];
      } else {
        userNotifications=[];
      }
      $('#notif-dot').classList.toggle('hidden', userNotifications.length === 0);
    } else {
      currentProfile=null;
      userFavorites.clear();
      userNotifications=[];
      $('#notif-dot').classList.add('hidden');
    }
  } catch(e) {
    console.error('Erreur user data:', e);
  }
}

/* ===== Système de Niveaux ===== */
function getRankProgress(count){
  if(count >= 50){
    return { name: '⚡ Dieux des urbex', color: '#b000ff', current: count, next: 50, pct: 100, label: 'Niveau Maximum !', scintillate: true };
  } else if(count >= 35){
    const pct = Math.round(((count - 35) / (50 - 35)) * 100);
    return { name: '👑 Roi des Urbex', color: '#ffd700', current: count, next: 50, pct, label: `${50 - count} lieu(x) avant Dieux des urbex` };
  } else if(count >= 25){
    const pct = Math.round(((count - 25) / (35 - 25)) * 100);
    return { name: '🐐 Goat des urbex', color: '#f0883e', current: count, next: 35, pct, label: `${35 - count} lieu(x) avant Roi des Urbex` };
  } else if(count >= 15){
    const pct = Math.round(((count - 15) / (25 - 15)) * 100);
    return { name: '🌙 Urbexeur de la Nuit', color: '#33b3ae', current: count, next: 25, pct, label: `${25 - count} lieu(x) avant Goat des urbex` };
  } else if(count >= 8){
    const pct = Math.round(((count - 8) / (15 - 8)) * 100);
    return { name: '🔦 Urbexeur', color: '#3fb950', current: count, next: 15, pct, label: `${15 - count} lieu(x) avant Urbexeur de la Nuit` };
  } else if(count >= 3){
    const pct = Math.round(((count - 3) / (8 - 3)) * 100);
    return { name: '🧭 p’tit explorateur', color: '#a371f7', current: count, next: 8, pct, label: `${8 - count} lieu(x) avant Urbexeur` };
  } else {
    const pct = Math.round((count / 3) * 100);
    return { name: '🌱 petit neuille', color: '#8b949e', current: count, next: 3, pct, label: `${3 - count} lieu(x) avant p’tit explorateur` };
  }
}

/* ===== Notifications Administrateur ===== */
async function openAdminNotifs(){
  const {data:profiles}=await sb.from('profiles').select('id, username');
  const profileMap={};
  (profiles||[]).forEach(p=>profileMap[p.id]=p.username||'Explorateur');

  $('#admin-notif-content').innerHTML=(spots||[]).map(s=>{
    const author=s.user_id?(profileMap[s.user_id]||'Explorateur'):'Anonyme';
    const date=new Date(s.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const cat=CAT[s.category]||CAT.autre;
    return `
      <div class="p-3 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-between gap-2 cursor-pointer hover:border-amber-500/50 transition" onclick="closeAdminNotifs(); openSpot('${s.id}', true);">
        <div class="space-y-1 min-w-0">
          <div class="font-semibold text-sm truncate">${cat[0]} ${esc(s.title)}</div>
          <div class="text-xs text-zinc-400">Ajouté par <b class="text-zinc-300">${esc(author)}</b> le ${date}</div>
        </div>
        <span class="btn !flex-none text-xs px-2.5 py-1">Voir ➔</span>
      </div>
    `;
  }).join('')||'<p class="text-zinc-500 text-center py-4">Aucun lieu enregistré.</p>';

  $('#admin-notif-modal').classList.remove('hidden');
}
function closeAdminNotifs(){$('#admin-notif-modal').classList.add('hidden');}
$('#admin-notif-btn').onclick=openAdminNotifs;
$('#admin-notif-close').onclick=closeAdminNotifs;

/* ===== Fenêtre Classement (Leaderboard) ===== */
async function openLeaderboard(){
  const {data:profiles}=await sb.from('profiles').select('id, username');
  const counts={};
  spots.forEach(s=>{
    if(s.user_id) counts[s.user_id]=(counts[s.user_id]||0)+1;
  });
  const list=(profiles||[]).map(p=>{
    const count=counts[p.id]||0;
    return {username:p.username||'Explorateur', count, rank:rankOf(p.id,count)};
  }).sort((a,b)=>b.count-a.count);

  $('#lb-content').innerHTML=list.map((item,idx)=>{
    const scClass=item.rank.scintillateRed?'red-scintillating':(item.rank.scintillate?'scintillating':'');
    return `<div class="flex items-center justify-between p-2.5 rounded-xl bg-zinc-900 border border-zinc-800">
      <div class="flex items-center gap-3">
        <span class="font-bold text-sm w-6 text-center ${idx===0?'text-amber-400':idx===1?'text-zinc-300':idx===2?'text-amber-600':'text-zinc-500'}">#${idx+1}</span>
        <div>
          <div class="font-semibold text-sm">${esc(item.username)}</div>
          <div class="text-xs ${scClass}" style="color:${item.rank.color}">${item.rank.name}</div>
        </div>
      </div>
      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300">${item.count} spot(s)</span>
    </div>`;
  }).join('')||'<p class="text-zinc-500 text-center py-4">Aucun explorateur classé pour le moment.</p>';

  $('#lb-modal').classList.remove('hidden');
}
$('#lb-btn').onclick=openLeaderboard;
$('#lb-close').onclick=()=>$('#lb-modal').classList.add('hidden');

/* ===== Profil & Auth ===== */
const authModal=$('#auth-modal'), authContent=$('#auth-content');
function toggleAuthModal(show){authModal.classList.toggle('hidden',!show)}
$('#user-btn').onclick=()=>renderAuthBox();
$('#auth-close').onclick=()=>toggleAuthModal(false);

async function renderAuthBox(){
  await loadUserData();
  
  if(currentUser){
    const mySpots=spots.filter(s=>s.user_id===currentUser.id);
    const prog=rankOf(currentUser.id,mySpots.length);
    const scClass=prog.scintillateRed?'red-scintillating':(prog.scintillate?'scintillating':'');
    
    authContent.innerHTML=`
      <div class="space-y-4">
        <!-- Badge & Progression -->
        <div class="rounded-xl p-3 border border-zinc-800 bg-zinc-900/60 space-y-2">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full flex items-center justify-center text-lg font-bold border-2 shrink-0 ${scClass}" style="border-color:${prog.color};background:${prog.color}22;color:${prog.color}">
              ${mySpots.length}
            </div>
            <div class="flex-1">
              <div class="font-bold text-base ${scClass}" style="color:${prog.color}">${prog.name}</div>
              <div class="text-xs text-zinc-400">${mySpots.length} spot(s) publié(s)</div>
            </div>
          </div>
          <!-- Barre de progression -->
          <div class="space-y-1 pt-1">
            <div class="w-full bg-zinc-800 rounded-full h-2 overflow-hidden">
              <div class="h-full transition-all duration-500 rounded-full" style="width:${prog.pct}%;background:${prog.color}"></div>
            </div>
            <div class="text-[11px] text-zinc-400 text-right">${prog.label}</div>
          </div>
        </div>

        <!-- Modifier Pseudo -->
        <div class="space-y-1">
          <label class="text-xs text-zinc-400">Mon Pseudo :</label>
          <div class="flex gap-2">
            <input id="prof-uname" class="inp !py-1.5" value="${esc(currentProfile?.username||'')}">
            <button id="save-uname" class="btn !flex-none">Changer</button>
          </div>
        </div>

        <!-- Titre Admin (visible uniquement par l'administrateur) -->
        ${admin ? `
          <div class="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 p-3">
            <div>
              <div class="text-sm font-semibold">🛡️ Titre Admin</div>
              <div class="text-xs text-zinc-400">Remplace mon grade partout</div>
            </div>
            <button class="btn !flex-none ${adminRankOn?'sel':''}" onclick="toggleAdminTitle()">${adminRankOn?'Activé':'Désactivé'}</button>
          </div>
        ` : ''}

        <!-- Notifications / Activité sur mes spots -->
        <div>
          <h3 class="text-sm font-semibold mb-2">🔔 Activité sur mes spots (${userNotifications.length})</h3>
          <div class="max-h-40 overflow-y-auto space-y-2 text-xs">
            ${userNotifications.map(n=>{
              const sp=spots.find(x=>x.id===n.spot_id);
              const date=new Date(n.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
              return sp ? `
                <div class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 space-y-1 cursor-pointer hover:border-amber-500/50 transition" onclick="toggleAuthModal(false); openSpot('${sp.id}', true);">
                  <div class="flex justify-between items-center text-zinc-400">
                    <span><b>${esc(n.author)}</b> sur <span class="text-zinc-200">${esc(sp.title)}</span></span>
                    <span class="text-[10px]">${date}</span>
                  </div>
                  <p class="text-zinc-300 italic">« ${esc(n.body)} »</p>
                </div>
              ` : '';
            }).join('') || '<p class="text-zinc-500 text-center py-2">Aucune nouvelle interaction sur vos lieux.</p>'}
          </div>
        </div>

        <!-- Favoris -->
        <div>
          <h3 class="text-sm font-semibold mb-2">⭐ Mes Favoris (${userFavorites.size})</h3>
          <div class="max-h-28 overflow-y-auto space-y-1 text-xs">
            ${Array.from(userFavorites).map(fid=>{
              const sp=spots.find(x=>x.id===fid);
              return sp ? `<div class="p-2 rounded bg-zinc-900 border border-zinc-800 flex justify-between items-center"><span class="cursor-pointer font-medium hover:underline" onclick="toggleAuthModal(false);openSpot('${sp.id}',true)">${esc(sp.title)}</span></div>` : '';
            }).join('') || '<p class="text-zinc-500">Aucun favori enregistré.</p>'}
          </div>
        </div>

        <button id="logout-btn" class="btn w-full !bg-red-500/20 !border-red-500/50 text-red-300">Se déconnecter</button>
      </div>
    `;

    $('#save-uname').onclick=async()=>{
      const nu=$('#prof-uname').value.trim();if(!nu)return toast('Le pseudo ne peut pas être vide');
      const {error}=await sb.from('profiles').upsert({id: currentUser.id, username: nu});
      if(error) return toast('Erreur : '+error.message);
      toast('Pseudo mis à jour !');
      await loadUserData();
      renderAuthBox();
    };

    $('#logout-btn').onclick=async()=>{
      await sb.auth.signOut();
      await loadUserData();
      toggleAuthModal(false);
      render();
      toast('Déconnecté');
    };
  } else {
    authContent.innerHTML=`
      <div class="flex gap-2 mb-3">
        <button id="tab-login" class="btn sel">Connexion</button>
        <button id="tab-signup" class="btn">Inscription</button>
      </div>
      <form id="auth-form" class="space-y-3">
        <div id="signup-extra" class="hidden">
          <label class="text-xs text-zinc-400 block mb-1">Pseudo * (Obligatoire)</label>
          <input id="auth-username" type="text" class="inp" placeholder="Ton pseudo d'explorateur">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Adresse e-mail *</label>
          <input id="auth-email" type="email" required class="inp" placeholder="exemple@mail.com">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Mot de passe *</label>
          <input id="auth-pass" type="password" required minlength="6" class="inp" placeholder="6 caractères minimum">
        </div>
        <button type="submit" id="auth-submit" class="btn w-full !font-semibold" style="background:var(--a);border-color:var(--a);color:#111">Se connecter</button>
      </form>
    `;
    
    let isSignup=false;
    $('#tab-login').onclick=()=>{isSignup=false; $('#tab-login').classList.add('sel'); $('#tab-signup').classList.remove('sel'); $('#signup-extra').classList.add('hidden'); $('#auth-submit').textContent='Se connecter';};
    $('#tab-signup').onclick=()=>{isSignup=true; $('#tab-signup').classList.add('sel'); $('#tab-login').classList.remove('sel'); $('#signup-extra').classList.remove('hidden'); $('#auth-submit').textContent="S'inscrire";};
    
    $('#auth-form').onsubmit=async e=>{
      e.preventDefault();
      const email=$('#auth-email').value.trim();
      const password=$('#auth-pass').value.trim();
      const username=$('#auth-username')?.value.trim();
      
      if(isSignup){
        if(!username) return toast('Veuillez choisir un pseudo obligatoire !');
        const {error}=await sb.auth.signUp({
          email, password, options:{ data:{ username } }
        });
        if(error) return toast(error.message);
        toast('Compte créé avec succès !');
      } else {
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error) return toast('Erreur : '+error.message);
        toast('Connecté !');
      }
      await loadUserData();
      toggleAuthModal(false);
      if(cur) openSpot(cur);
    };
  }
  toggleAuthModal(true);
}

/* ===== Filtres & recherche ===== */
[['#fc',CAT,'c'],['#fd',DNG,'d'],['#fa',ACC,'a']].forEach(([id,o,k])=>{
  const el=$(id);
  el.innerHTML=Object.entries(o).map(([key,v])=>`<button type="button" data-k="${key}" class="chip on">${ic(v)}${v[1]}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=flt[k];s.has(b.dataset.k)?s.delete(b.dataset.k):s.add(b.dataset.k);b.classList.toggle('on');render()};
});
$('#fr').onclick=()=>{[['c',CAT],['d',DNG],['a',ACC]].forEach(([k,o])=>flt[k]=new Set(Object.keys(o)));document.querySelectorAll('.chip').forEach(c=>c.classList.add('on'));render()};
$('#fb').onclick=()=>$('#fp').classList.toggle('hidden');
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&accept-language=fr&q='+encodeURIComponent(q));return (await r.json())[0]}
$('#sf').onsubmit=async e=>{
  e.preventDefault();const q=$('#q').value.trim();if(!q)return;
  try{const g=await geo(q);if(!g)return toast('Lieu introuvable en France');const b=g.boundingbox;map.fitBounds([[b[0],b[2]],[b[1],b[3]]],{maxZoom:14});$('#fp').classList.add('hidden')}
  catch{toast('Recherche indisponible')}
};

/* ===== Fiche d’un lieu ===== */
function closeSheet(){$('#sheet').classList.add('hidden');$('#fab').classList.remove('hidden');cur=null;history.replaceState(null,'',location.pathname+location.search)}
function openSpot(id,fly){
  const s=spots.find(x=>x.id===id);if(!s)return;
  cur=id;history.replaceState(null,'','#spot='+id);if(fly)map.setView([s.lat,s.lng],15);
  const c=CAT[s.category]||CAT.autre,a=ACC[s.access]||ACC.moyen,d=DNG[s.danger]||DNG.faible,ph=(s.photos||[]).filter(safe),mv=localStorage['v_'+id],sh=$('#sheet');
  const isFav=userFavorites.has(s.id);

  sh.innerHTML=`
  <div class="sticky top-0 z-10 flex justify-between items-center p-3 panel !border-0"><span class="text-sm text-zinc-400">${c[0]} ${c[1]}</span><button onclick="closeSheet()" class="text-2xl px-2" aria-label="Fermer">×</button></div>
  ${ph.length?`<div class="flex gap-2 overflow-x-auto px-3 pb-2">${ph.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt="" class="h-44 max-w-none rounded-lg"></a>`).join('')}</div>`:''}
  <div class="p-4 space-y-3">
    <div class="flex justify-between items-start gap-2">
      <h2 class="text-xl font-bold flex-1">${esc(s.title)}</h2>
      <button class="btn !flex-none !p-2 text-lg" onclick="toggleFav('${s.id}')">${isFav?'⭐':'☆'}</button>
    </div>
    ${s.status!=='active'?`<div class="rounded-lg bg-amber-500/15 text-amber-300 text-sm p-2">⏳ En attente de vérification : des membres signalent que ce lieu n’existe plus.</div>`:''}
    <div class="flex flex-wrap gap-2 text-xs"><span class="pill">${a[0]} ${a[1]}</span><span class="pill" style="border-color:${d[0]}">${ic(d)}${d[1]}</span></div>
    
    <!-- Boutons Pilules GPS Google Maps, Street View, Google Earth -->
    <div class="flex flex-wrap gap-2 pt-1">
      <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" rel="noopener" class="gps-pill">🗺️ Google Maps</a>
      <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${s.lat},${s.lng}" target="_blank" rel="noopener" class="gps-pill">📸 Street View</a>
      <a href="https://earth.google.com/web/@${s.lat},${s.lng},100a,35y,0h,0t,0r" target="_blank" rel="noopener" class="gps-pill">🌍 Google Earth</a>
    </div>

    <p class="whitespace-pre-line text-sm text-zinc-300 pt-1">${esc(s.description)}</p>
    
    <!-- Zone Signalement / Vote (Restreint aux membres connectés) -->
    <div class="rounded-xl border border-zinc-800 p-3">
      <div class="text-sm font-semibold mb-2">Toujours là ? <span class="font-normal text-zinc-400">${s.still_yes} oui · ${s.still_no} non</span></div>
      ${currentUser ? `
        <div class="flex gap-2">
          <button class="btn ${mv==='1'?'sel':''}" onclick="vote('${s.id}',true)">👍 Oui, il existe</button>
          <button class="btn ${mv==='0'?'sel':''}" onclick="vote('${s.id}',false)">💥 Démoli / fermé</button>
        </div>
      ` : `
        <button class="btn w-full !bg-zinc-800/80 text-zinc-400" onclick="renderAuthBox()">🔒 Connecte-toi pour signaler l'état</button>
      `}
    </div>

    <div class="flex gap-2"><button class="btn" onclick="share('${s.id}')">🔗 Partager le lieu</button></div>
    
    ${(admin || (currentUser && s.user_id===currentUser.id)) ? `<div class="flex flex-wrap gap-2 border-t border-zinc-800 pt-3"><button class="btn" onclick="editSpot('${s.id}')">✏️ Modifier</button>${admin?`<button class="btn" onclick="keepSpot('${s.id}')">✅ Lever l’alerte</button><button class="btn !border-red-500 text-red-400" onclick="delSpot('${s.id}')">🗑 Supprimer</button>`:''}</div>`:''}
    
    <!-- Zone Commentaires (Restreint aux membres connectés) -->
    <h3 class="font-semibold pt-2">Commentaires</h3>
    <div id="cm" class="space-y-2 text-sm"></div>
    
    ${currentUser ? `
      <div class="space-y-2 pt-1">
        <textarea id="cbody" class="inp" rows="2" maxlength="1000" placeholder="Conseil d’accès, retour d’expérience…"></textarea>
        <button class="btn w-full" onclick="addCom('${s.id}')">Publier un commentaire (${esc(currentProfile?.username||'Moi')})</button>
      </div>
    ` : `
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 p-3 text-center space-y-2">
        <p class="text-xs text-zinc-400">Tu dois être connecté pour poster un commentaire.</p>
        <button class="btn w-full !bg-amber-500/10 !border-amber-500/40 text-amber-300" onclick="renderAuthBox()">Se connecter / S'inscrire</button>
      </div>
    `}
  </div>`;
  sh.classList.remove('hidden');sh.scrollTop=0;$('#fab').classList.add('hidden');$('#fp').classList.add('hidden');loadCom(id);
}

async function toggleFav(id){
  if(!currentUser) return toast('Connectez-vous pour sauvegarder en favori');
  if(userFavorites.has(id)){
    await sb.from('favorites').delete().eq('user_id',currentUser.id).eq('spot_id',id);
    userFavorites.delete(id);
    toast('Retiré des favoris');
  } else {
    await sb.from('favorites').insert({user_id:currentUser.id, spot_id:id});
    userFavorites.add(id);
    toast('Ajouté aux favoris !');
  }
  openSpot(id);
}

async function loadCom(id){
  const {data}=await sb.from('comments').select('*').eq('spot_id',id).order('created_at',{ascending:false});
  const el=$('#cm');if(!el)return;
  el.innerHTML=(data||[]).map(c=>{
    let rankHtml='';
    if(c.user_id){
      const count=spots.filter(s=>s.user_id===c.user_id).length;
      const r=rankOf(c.user_id,count);
      const scClass=r.scintillateRed?'red-scintillating':(r.scintillate?'scintillating':'');
      rankHtml=`<span class="text-[10px] px-1.5 py-0.5 rounded ml-1 border font-medium ${scClass}" style="border-color:${r.color};color:${r.color};background:${r.color}15">${r.name}</span>`;
    }
    return `<div class="rounded-lg bg-zinc-900 p-2">
      <div class="text-xs text-zinc-500 flex justify-between items-center">
        <div><span class="font-semibold text-zinc-300">${esc(c.author)}</span> ${rankHtml} <span class="text-zinc-500">· ${new Date(c.created_at).toLocaleDateString('fr-FR')}</span></div>
        ${admin?`<button onclick="delCom('${c.id}','${id}')" aria-label="Supprimer">✕</button>`:''}
      </div>
      <p class="mt-1">${esc(c.body)}</p>
    </div>`;
  }).join('')||'<p class="text-zinc-500">Aucun commentaire. Soyez le premier à donner un conseil d’accès !</p>';
}

async function addCom(id){
  if(!currentUser) return toast('Connexion requise');
  const body=$('#cbody').value.trim();if(!body)return;
  const author=currentProfile?.username || 'Explorateur';
  const {error}=await sb.from('comments').insert({spot_id:id, author, body, user_id: currentUser.id});
  if(error)return toast(error.message);
  loadCom(id);$('#cbody').value='';
}

async function vote(id,yes){
  if(!currentUser) return toast('Connectez-vous pour signaler un lieu');
  const {error}=await sb.rpc('vote',{p_spot:id,p_voter:voter,p_still:yes});
  if(error)return toast(error.message);
  localStorage['v_'+id]=yes?'1':'0';
  toast('Merci pour votre vote !');
  await load();openSpot(id);
}

function share(id){const u=location.origin+location.pathname+'#spot='+id;navigator.share?navigator.share({title:'Urbex France',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>toast('Lien copié'))}

/* ===== Ajout / modification ===== */
const F=$('#f');
F.elements.category.innerHTML=opts(CAT);F.elements.access.innerHTML=opts(ACC);F.elements.danger.innerHTML=opts(DNG);
const showForm=on=>$('#modal').classList.toggle('hidden',!on);
function setPos(la,ln){draft.lat=la;draft.lng=ln;$('#coord').textContent=la.toFixed(5)+', '+ln.toFixed(5);map.setView([la,ln],Math.max(map.getZoom(),15))}
function openForm(s){
  if(!currentUser && !s.id){
    toast('Connecte-toi pour ajouter un nouveau lieu !');
    return renderAuthBox();
  }
  F.reset();draft={id:s.id,lat:null,lng:null};formOn=true;closeSheet();
  const e=F.elements;e.title.value=s.title||'';e.category.value=s.category||'maison';e.access.value=s.access||'moyen';e.danger.value=s.danger||'faible';e.description.value=s.description||'';e.urls.value=(s.photos||[]).join('\n');
  $('#mt').textContent=s.id?'Modifier le lieu':'Ajouter un lieu';$('#coord').textContent='non définie';
  if(s.lat!=null)setPos(s.lat,s.lng);showForm(true);
}
function closeForm(){formOn=false;showForm(false)}
function startPlacing(){
  if(!currentUser){
    toast('Connecte-toi pour ajouter un lieu !');
    return renderAuthBox();
  }
  placing=true;showForm(false);closeSheet();$('#fp').classList.add('hidden');$('#hint').classList.remove('hidden');map.getContainer().style.cursor='crosshair';
}
function stopPlacing(){placing=false;$('#hint').classList.add('hidden');map.getContainer().style.cursor=''}
$('#fab').onclick=startPlacing;$('#onmap').onclick=startPlacing;$('#mx').onclick=closeForm;
$('#hf').onclick=()=>{stopPlacing();formOn?showForm(true):openForm({})};
$('#hx').onclick=()=>{stopPlacing();formOn&&showForm(true)};
map.on('click',e=>{if(!placing)return;stopPlacing();if(formOn){setPos(e.latlng.lat,e.latlng.lng);showForm(true)}else openForm({lat:e.latlng.lat,lng:e.latlng.lng})});
$('#geo').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setPos(p.coords.latitude,p.coords.longitude),()=>toast('Position indisponible')):toast('Géolocalisation non supportée');
$('#ag').onclick=async()=>{const q=$('#addr').value.trim();if(!q)return;try{const g=await geo(q);g?setPos(+g.lat,+g.lon):toast('Adresse introuvable')}catch{toast('Recherche indisponible')}};
$('#addr').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#ag').click()}};
async function upload(files){
  const out=[];
  for(const f of files){
    const p=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');
    const {error}=await sb.storage.from('photos').upload(p,f,{contentType:f.type});
    if(error){toast('Photo refusée : '+error.message);continue}
    out.push(sb.storage.from('photos').getPublicUrl(p).data.publicUrl);
  }
  return out;
}
F.onsubmit=async e=>{
  e.preventDefault();if(draft.lat==null)return toast('Définissez d’abord l’emplacement');
  const b=F.querySelector('[type=submit]'),fd=Object.fromEntries(new FormData(F)),id=draft.id;b.disabled=true;
  const urls=fd.urls.split('\n').map(x=>x.trim()).filter(safe),up=await upload([...$('#files').files]);
  const row={title:fd.title.trim(),category:fd.category,access:fd.access,danger:fd.danger,description:fd.description.trim(),photos:[...urls,...up],lat:draft.lat,lng:draft.lng, user_id: currentUser?.id || null};
  const {error}=await(id?sb.from('spots').update(row).eq('id',id):sb.from('spots').insert(row));
  b.disabled=false;if(error)return toast(error.message);
  closeForm();await load();toast(id?'Lieu modifié':'Lieu ajouté, merci !');id&&openSpot(id,true);
};

/* ===== Administration ===== */
const editSpot=id=>openForm(spots.find(x=>x.id===id));
async function delSpot(id){if(!confirm('Supprimer définitivement ce lieu et ses commentaires ?'))return;const {error}=await sb.from('spots').delete().eq('id',id);if(error)return toast(error.message);closeSheet();await load();toast('Lieu supprimé')}
async function keepSpot(id){
  await sb.from('votes').delete().eq('spot_id',id);await sb.from('admin_alerts').update({handled:true}).eq('spot_id',id);
  const {error}=await sb.from('spots').update({status:'active',still_yes:0,still_no:0}).eq('id',id);
  if(error)return toast(error.message);await load();openSpot(id);toast('Alerte levée')
}
async function delCom(c,id){await sb.from('comments').delete().eq('id',c);loadCom(id)}
async function checkAdmin(s){
  await loadUserData();
  admin=!!s&&(await sb.rpc('is_admin')).data===true;
  $('#ab').textContent=admin?'🔓':'🔒';
  $('#admin-notif-btn').classList.toggle('hidden', !admin);
  render();cur&&openSpot(cur);
}
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>checkAdmin(s),0));
$('#ab').onclick=async()=>{
  if(admin)return sb.auth.signOut();
  const email=prompt('E-mail administrateur');if(!email)return;const password=prompt('Mot de passe');if(!password)return;
  const {error}=await sb.auth.signInWithPassword({email,password});if(error)toast('Connexion refusée');
};
$('#pb').onclick=()=>{const p=spots.filter(s=>s.status!=='active');if(p.length>0)openSpot(p[pi++%p.length].id,true)};

(async()=>{await load();const m=location.hash.match(/spot=([\w-]+)/);m&&openSpot(m[1],true)})();
</script>
</body>
</html>
